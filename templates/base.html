<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}ScholarSync AI{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body class="ss-body">
{% if request.path not in ['/', '/student-login', '/faculty-login', '/login'] %}<nav class="ss-topbar"><div class="container-fluid ss-topbar-inner"><a id="ssBrandHome" class="ss-brand" href="/"><span class="brand-mark">✦</span><span>ScholarSync <b>AI</b></span></a><div class="ss-navlinks">
<a href="/student-dashboard" data-role-nav="student" class="ss-navlink">Student Home</a>
<a href="/faculty-dashboard" data-role-nav="faculty" class="ss-navlink">Faculty Home</a>
<a href="/chat" data-role-nav="student" class="ss-navlink">AI Chat</a>
<a href="/notes" data-role-nav="student" class="ss-navlink">Notes</a>
<a href="/planner" data-role-nav="student" class="ss-navlink">Planner</a>
<a href="/quiz" data-role-nav="student" class="ss-navlink">Quiz</a>
<a href="/faculty-profile" data-role-nav="faculty" class="ss-navlink">Faculty Profile</a>
<a href="/profile" data-role-nav="student" class="ss-navlink">Profile</a>
<button id="logoutBtn" class="ss-logout" type="button">Logout</button></div></div></nav>{% endif %}
<main class="ss-main">{% block content %}{% endblock %}</main><script type="module" src="{{ url_for('static', filename='js/firebase.js') }}"></script><script type="module" src="{{ url_for('static', filename='js/app.js') }}?v=2"></script>{% block scripts %}{% endblock %}</body></html>
